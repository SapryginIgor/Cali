services:
  singbox:
    image: ghcr.io/sagernet/sing-box:latest
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        if [ -z "$SINGBOX_CONFIG_JSON" ] && [ -z "$SINGBOX_CONFIG_JSON_B64" ]; then
          echo "SINGBOX_CONFIG_JSON or SINGBOX_CONFIG_JSON_B64 is required"
          exit 1
        fi
        if [ -n "$SINGBOX_CONFIG_JSON_B64" ]; then
          printf "%s" "$SINGBOX_CONFIG_JSON_B64" | base64 -d > /tmp/config.json
        else
          printf "%s" "$SINGBOX_CONFIG_JSON" > /tmp/config.json
        fi
        sing-box check -c /tmp/config.json
        exec sing-box run -c /tmp/config.json
    environment:
      SINGBOX_CONFIG_JSON: ${SINGBOX_CONFIG_JSON}
      SINGBOX_CONFIG_JSON_B64: ${SINGBOX_CONFIG_JSON_B64}

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - singbox
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      PORT: 8000
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      HTTP_PROXY: http://singbox:3128
      HTTPS_PROXY: http://singbox:3128
      NO_PROXY: localhost,127.0.0.1,singbox,backend,supabase.co,*.supabase.co
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-20}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      # optional if using JWKS path too:
      SUPABASE_JWT_JWKS: ${SUPABASE_JWT_JWKS}
